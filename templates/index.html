<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudyAgent AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#080b16;color:#f4f7ff;min-height:100vh}
.container{max-width:900px;margin:auto;padding:40px 20px}
.card{background:rgba(20,25,45,.85);border:1px solid #2d3760;border-radius:22px;padding:28px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
h1{margin:0 0 8px;font-size:34px}
.sub{color:#9ca9c9;margin-bottom:25px}
.chat{height:420px;overflow-y:auto;padding:10px}
.msg{padding:13px 16px;border-radius:16px;margin:12px 0;line-height:1.55;white-space:pre-wrap}
.user{background:#24366d;margin-left:18%;text-align:right}
.bot{background:#151d35;margin-right:12%}
.form{display:flex;gap:10px;margin-top:18px}
input{flex:1;background:#0c1122;border:1px solid #35416d;color:white;border-radius:14px;padding:15px;font-size:16px}
button{border:0;border-radius:14px;padding:0 22px;background:#536dfe;color:white;font-weight:bold;cursor:pointer}
button:disabled{opacity:.5}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.quick button{padding:9px 12px;font-size:13px}
</style>
</head>
<body>
<div class="container">
<div class="card">
<h1>🤖 StudyAgent AI</h1>
<div class="sub">An AI Agent with tool calling for study, coding and technical tasks.</div>
<div id="chat" class="chat">
<div class="msg bot">Hello! I am StudyAgent. Ask me a study, coding, project, or technical question.</div>
</div>
<div class="quick">
<button onclick="fillQ('Explain Python functions simply')">Python Functions</button>
<button onclick="fillQ('Give me a mini AI project idea')">Project Idea</button>
<button onclick="fillQ('Calculate 125 * 48')">Calculator</button>
</div>
<div class="form">
<input id="question" placeholder="Ask your question..." onkeydown="if(event.key==='Enter') sendMessage()">
<button id="send" onclick="sendMessage()">Send</button>
</div>
</div>
</div>
<script>
const input=document.getElementById("question");
const chat=document.getElementById("chat");
const send=document.getElementById("send");

function fillQ(q){input.value=q;input.focus()}

function addMsg(text, cls){
  const div=document.createElement("div");
  div.className="msg "+cls;
  div.textContent=text;
  chat.appendChild(div);
  chat.scrollTop=chat.scrollHeight;
}

async function sendMessage(){
  const q=input.value.trim();
  if(!q)return;
  addMsg(q,"user");
  input.value="";
  send.disabled=true;
  addMsg("Thinking...","bot");
  const thinking=chat.lastChild;
  try{
    const res=await fetch("/ask",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({question:q})
    });
    const data=await res.json();
    thinking.textContent=data.answer || "No response.";
  }catch(e){
    thinking.textContent="Connection error. Check that Flask is running.";
  }finally{
    send.disabled=false;
    input.focus();
  }
}
</script>
</body>
</html>
